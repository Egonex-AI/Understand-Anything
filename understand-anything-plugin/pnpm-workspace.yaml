packages:
  - "packages/*"
allowBuilds:
  '@tree-sitter-grammars/tree-sitter-kotlin': true
  esbuild: true
  tree-sitter-c: true
  tree-sitter-c-sharp: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-php: true
  # Explicitly declined: the npm install script compiles native bindings we
  # never use (web-tree-sitter loads the bundled .wasm). Declining silences
  # pnpm 12's strict ignored-builds error without running the native build.
  'tree-sitter-puppet': false
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-scala: true
  tree-sitter-typescript: true
